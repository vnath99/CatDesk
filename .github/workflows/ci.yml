name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Isolate the native PowerShell shell/cwd integration test from parallel
      # Windows security-process fixtures. Both steps together test the entire
      # Rust suite; the full-suite step excludes only the test already run here.
      - name: Parse fixed T0474 read-only recovery script (no execution)
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/t0474_readonly_rotation_open_probes.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $source = Get-Content -LiteralPath 'scripts/t0474_readonly_rotation_open_probes.ps1' -Raw
          $native = [regex]::Match($source, '(?ms)^\$Native = @''\r?\n(.*?)\r?\n''@')
          if (-not $native.Success) { throw 'T0474 fixed native shim declaration not found' }
          Add-Type -TypeDefinition $native.Groups[1].Value -ErrorAction Stop
      - name: Test PowerShell shell and cwd (isolated)
        run: cargo test --locked command::tests::run_command_uses_platform_shell_and_cwd -- --exact
      - name: Test remaining Rust suite
        run: cargo test --locked -- --skip command::tests::run_command_uses_platform_shell_and_cwd

  python:
    name: Python Wake and advisor tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run full offline Python test suite
        run: python -m pytest -q --tb=short

  wake-rust:
    name: Independent WakeHost Rust
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Wake crate
        run: cargo fmt --manifest-path wake/Cargo.toml --all -- --check
      - name: Strict Clippy Wake crate
        run: cargo clippy --keep-going --locked --manifest-path wake/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test Wake crate
        run: cargo test --locked --manifest-path wake/Cargo.toml --all-features
