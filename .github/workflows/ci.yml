name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test

  python:
    name: Python Wake and advisor tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run full offline Python test suite
        run: python -m pytest -q --tb=short

  wake-rust:
    name: Independent WakeHost Rust
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Wake crate
        run: cargo fmt --manifest-path wake/Cargo.toml --all -- --check
      - name: Strict Clippy Wake crate
        run: cargo clippy --keep-going --locked --manifest-path wake/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test Wake crate
        run: cargo test --locked --manifest-path wake/Cargo.toml --all-features
